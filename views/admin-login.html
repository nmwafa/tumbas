<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - UMKM Purworejo</title>
  <link rel="icon" type="image/png" href="/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-lime-50 min-h-screen text-gray-800" x-data="adminLoginApp()">
  <div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md">
      <div class="bg-white/95 p-6 sm:p-8 rounded-3xl shadow-[0_24px_70px_rgba(16,185,129,0.14)] border border-emerald-100/80 ring-1 ring-emerald-100 backdrop-blur-sm">
        <div class="flex justify-center mb-5">
          <img src="/img/logo.jfif" alt="Logo Tumbas" class="h-14 w-auto max-w-[220px] object-contain">
        </div>

        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-emerald-700">Login Admin</h2>
          <p class="text-sm text-gray-500 mt-1">Masuk untuk mengelola katalog produk</p>
        </div>

        <form @submit.prevent="login" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Username</label>
            <input type="text" x-model="formLogin.username" placeholder="Masukkan username"
                   class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300 bg-white"
                   required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
            <input type="password" x-model="formLogin.password" placeholder="Masukkan password"
                   class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300 bg-white"
                   required>
          </div>

          <p x-show="errorMessage" x-text="errorMessage" class="text-red-600 text-xs text-center"></p>

          <button type="submit"
                  class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all duration-200">
            Masuk
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function adminLoginApp() {
      return {
        formLogin: { username: '', password: '' },
        errorMessage: '',
        async login() {
          this.errorMessage = '';

          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.formLogin)
          });

          const data = await res.json();

          if (res.ok) {
            window.location.href = '/4dm1n/dashboard';
            return;
          }

          this.errorMessage = data.error || 'Login gagal';
        }
      }
    }
  </script>
</body>
</html>
