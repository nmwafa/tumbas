<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <link rel="icon" type="image/png" href="/img/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-lime-50 min-h-screen text-gray-800" x-data="adminLoginApp()">
  <div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md">
      <div class="bg-white/95 p-6 sm:p-8 rounded-3xl shadow-[0_24px_70px_rgba(16,185,129,0.14)] border border-emerald-100/80 ring-1 ring-emerald-100 backdrop-blur-sm">
        <div class="flex justify-center mb-5">
          <img src="/img/logo.svg" alt="Logo Tumbas" class="h-14 w-auto max-w-[220px] object-contain">
        </div>

        <div class="text-center mb-6">
          <h2 class="text-2xl font-bold text-emerald-700">Login Admin</h2>
          <p class="text-sm text-gray-500 mt-1">Masuk untuk mengelola katalog produk</p>
        </div>

        <form @submit.prevent="login" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Username</label>
            <input type="text" x-model="formLogin.username" placeholder="Masukkan username"
                   class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300 bg-white"
                   required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
            <div class="relative">
              <input type="text" x-model="formLogin.password" placeholder="Masukkan password"
                     :style="showPassword ? '' : '-webkit-text-security: disc; -moz-text-security: disc;'"
                     class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300 bg-white"
                     required>
              <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-emerald-600 transition" aria-label="Tampilkan atau sembunyikan password">
                <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
                <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.5 10.5A2.5 2.5 0 0012 15a2.5 2.5 0 001.5-4.5M9.88 5.15A10.94 10.94 0 0112 5c6 0 9.75 7 9.75 7a16.96 16.96 0 01-3.56 4.55M6.59 6.6A16.7 16.7 0 002.25 12s3.75 7 9.75 7a10.88 10.88 0 003.89-.76"/>
                </svg>
              </button>
            </div>
          </div>

          <p x-show="errorMessage" x-text="errorMessage" class="text-red-600 text-xs text-center"></p>

          <button type="submit"
                  class="w-full bg-emerald-600 text-white py-2.5 rounded-full text-sm font-semibold hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all duration-200">
            Masuk
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function adminLoginApp() {
      return {
        formLogin: { username: '', password: '' },
        showPassword: false,
        errorMessage: '',
        async login() {
          this.errorMessage = '';

          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.formLogin)
          });

          const data = await res.json();

          if (res.ok) {
            window.location.href = '/4dm1n/dashboard';
            return;
          }

          this.errorMessage = data.error || 'Login gagal';
        }
      }
    }
  </script>
</body>
</html>
