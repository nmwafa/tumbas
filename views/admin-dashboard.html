<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - UMKM Purworejo</title>
  <link rel="icon" type="image/png" href="/img/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-lime-50 min-h-screen text-gray-800" x-data="adminDashboardApp()">
  <nav class="bg-white/90 border-b border-emerald-100 px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center shadow-sm backdrop-blur-sm">
    <div class="flex items-center gap-3 min-w-0">
      <a href="/" class="inline-flex items-center">
        <img src="/img/logo.jfif" alt="Logo Tumbas" class="h-10 w-auto max-w-[180px] sm:h-12 sm:max-w-[220px] object-contain">
      </a>
    </div>
    <button @click="logout" class="inline-flex items-center justify-center w-10 h-10 rounded-xl border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 transition" aria-label="Keluar">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3-6 3 3m0 0-3 3m3-3H9"/>
      </svg>
    </button>
  </nav>

  <main class="max-w-5xl mx-auto p-6 min-h-[calc(100vh-100px)] bg-emerald-50/70 rounded-2xl">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold text-gray-800">Daftar Produk</h2>
      <button @click="openModalTambah" class="bg-emerald-600 text-white text-sm px-4 py-2.5 rounded-full font-medium hover:bg-emerald-700 shadow-md shadow-emerald-200 transition">+ Tambah Produk</button>
    </div>

    <div class="bg-white rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.08)] border border-emerald-100 overflow-hidden">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-gray-50 border-b text-gray-600">
          <tr>
            <th class="p-4">Nama Produk</th>
            <th class="p-4">Tab Kategori</th>
            <th class="p-4">Jumlah Penjual</th>
            <th class="p-4 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="p in products" :key="p.id">
            <tr class="border-b hover:bg-gray-50">
              <td class="p-4 font-semibold" x-text="p.name"></td>
              <td class="p-4">
                <span :class="p.category_tab === 'khas' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'" class="px-2 py-0.5 rounded text-xs uppercase font-bold" x-text="p.category_tab"></span>
              </td>
              <td class="p-4" x-text="p.sellers.length"></td>
              <td class="p-4 text-center">
                <button @click="openDeleteModal(p)" class="text-xs text-red-600 font-semibold hover:underline">Hapus</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>

  <div x-show="deleteTarget" x-cloak class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div @click.away="closeDeleteModal" class="bg-white rounded-3xl max-w-md w-full p-6 border border-red-100/80 ring-1 ring-red-100 shadow-[0_24px_70px_rgba(239,68,68,0.18)]">
      <div class="flex items-start gap-4">
        <div class="flex-shrink-0 w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-xl font-bold">!</div>
        <div class="flex-1">
          <h3 class="text-xl font-bold text-gray-900">Hapus Produk</h3>
          <p class="mt-2 text-sm text-gray-600">
            Apakah Anda yakin ingin menghapus produk
            <span class="font-semibold text-gray-900" x-text="deleteTarget?.name"></span>?
          </p>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button type="button" @click="closeDeleteModal" class="px-4 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition">Batal</button>
        <button type="button" @click="confirmDeleteProduct" class="px-4 py-2.5 rounded-xl bg-red-600 text-white text-sm font-semibold hover:bg-red-700 shadow-md shadow-red-200 transition">Hapus Produk</button>
      </div>
    </div>
  </div>

  <div x-show="showAddProductModal" x-cloak class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div @click.away="closeModalTambah" class="bg-white rounded-3xl max-w-xl w-full p-6 border border-emerald-100/80 ring-1 ring-emerald-100 shadow-[0_24px_70px_rgba(16,185,129,0.18)]">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-xl font-bold text-gray-900">Tambah Produk</h3>
        <button @click="closeModalTambah" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>

      <form @submit.prevent="submitProduct" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Produk</label>
            <input x-model="formProduct.name" type="text" class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300" required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
            <select x-model="formProduct.category_tab" class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300" required>
              <option value="khas">Khas</option>
              <option value="umum">Umum</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Harga / Rentang Harga</label>
            <input x-model="formProduct.price_range" type="text" class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300" placeholder="Contoh: Rp 10.000 - Rp 20.000" required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Gambar Produk</label>
            <div class="flex gap-2 mb-2">
              <button type="button" @click="imageSource = 'url'" :class="imageSource === 'url' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'" class="flex-1 rounded-xl px-3 py-2 text-xs font-semibold transition">
                Dari URL
              </button>
              <button type="button" @click="imageSource = 'upload'" :class="imageSource === 'upload' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'" class="flex-1 rounded-xl px-3 py-2 text-xs font-semibold transition">
                Upload File
              </button>
            </div>

            <input x-show="imageSource === 'url'" x-model="formProduct.image" type="url" class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300" placeholder="https://..." required>

            <div x-show="imageSource === 'upload'" class="space-y-2">
              <input type="file" accept="image/*" @change="handleImageFileChange" class="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white file:text-xs file:font-semibold hover:file:bg-emerald-700">
              <p class="text-[11px] text-gray-500" x-text="selectedImageFile ? 'File terpilih: ' + selectedImageFile.name : 'Belum ada file yang dipilih'"></p>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Deskripsi</label>
          <textarea x-model="formProduct.description" rows="4" class="w-full border border-emerald-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-300" required></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" @click="closeModalTambah" class="px-4 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition">Batal</button>
          <button type="submit" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 shadow-md shadow-emerald-200 transition">Simpan Produk</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function adminDashboardApp() {
      return {
        products: [],
        showAddProductModal: false,
        deleteTarget: null,
        imageSource: 'url',
        selectedImageFile: null,
        formProduct: {
          name: '',
          category_tab: 'khas',
          price_range: '',
          image: '',
          description: '',
          sellers: []
        },
        async init() {
          const statusRes = await fetch('/api/auth/status');
          const status = await statusRes.json();

          if (!status.loggedIn) {
            window.location.href = '/4dm1n';
            return;
          }

          await this.loadProducts();
        },
        async loadProducts() {
          const res = await fetch('/api/products');
          this.products = await res.json();
        },
        async logout() {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = '/4dm1n';
        },
        openDeleteModal(product) {
          this.deleteTarget = product;
        },
        closeDeleteModal() {
          this.deleteTarget = null;
        },
        async confirmDeleteProduct() {
          if (!this.deleteTarget) return;

          const productId = this.deleteTarget.id;
          this.closeDeleteModal();

          await fetch(`/api/products/${productId}`, { method: 'DELETE' });
          await this.loadProducts();
        },
        openModalTambah() {
          this.showAddProductModal = true;
        },
        closeModalTambah() {
          this.showAddProductModal = false;
          this.imageSource = 'url';
          this.selectedImageFile = null;
          this.formProduct = {
            name: '',
            category_tab: 'khas',
            price_range: '',
            image: '',
            description: '',
            sellers: []
          };
        },
        handleImageFileChange(event) {
          this.selectedImageFile = event.target.files[0] || null;
        },
        async submitProduct() {
          const payload = {
            ...this.formProduct,
            sellers: []
          };

          if (this.imageSource === 'upload') {
            if (!this.selectedImageFile) {
              alert('Pilih file gambar produk terlebih dahulu');
              return;
            }

            const uploadFormData = new FormData();
            uploadFormData.append('image', this.selectedImageFile);

            const uploadRes = await fetch('/api/products/upload', {
              method: 'POST',
              body: uploadFormData
            });

            const uploadData = await uploadRes.json();

            if (!uploadRes.ok) {
              alert(uploadData.error || 'Gagal mengupload gambar');
              return;
            }

            payload.image = uploadData.image;
          } else {
            if (!payload.image || !payload.image.trim()) {
              alert('Masukkan URL gambar produk');
              return;
            }
          }

          const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const data = await res.json();
            alert(data.error || 'Gagal menambah produk');
            return;
          }

          this.closeModalTambah();
          await this.loadProducts();
        }
      }
    }
  </script>
</body>
</html>
