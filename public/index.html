<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tumbas - Belanja Produk UMKM Purworejo</title>
  <link rel="icon" type="image/png" href="/img/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
    }

    .group.wa-hint-open {
      gap: 0.75rem;
    }

    .group.wa-hint-open .wa-hint-label {
      max-width: calc(100vw - 7rem);
      padding-left: 0.5rem;
      opacity: 1;
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: #9ca3af #f3f4f6;
      -ms-overflow-style: auto;
      scroll-behavior: smooth;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f3f4f6;
      border-radius: 12px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #9ca3af;
      border-radius: 12px;
      border: 2px solid transparent;
      background-clip: padding-box;
      min-height: 36px;
      box-shadow: none;
      transition: background 0.2s ease;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
      box-shadow: none;
    }

    .custom-scrollbar::-webkit-scrollbar-button {
      display: none;
      height: 0;
      width: 0;
    }

    .hide-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-emerald-50 text-gray-800" x-data="katalogApp()">

  <!-- Navbar -->
  <header class="bg-white border-b border-emerald-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 min-w-0">
          <a href="/">
            <img src="/img/logo.svg" alt="Logo Purworejo" class="h-10 w-auto max-w-[180px] sm:h-12 sm:max-w-[220px] object-contain">
          </a>
        </div>

        <button type="button"
                @click="mobileSearchOpen = !mobileSearchOpen"
                class="sm:hidden inline-flex items-center justify-center w-11 h-11 rounded-full border border-emerald-200 bg-white text-emerald-600 shadow-sm hover:bg-emerald-50 transition-all duration-200"
                aria-label="Buka pencarian">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>

        <input type="text" x-model="searchQuery" placeholder="Cari produk..." spellcheck="false"
               class="hidden sm:block w-full sm:w-80 px-4 py-2.5 border border-emerald-200 rounded-full bg-white/80 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 text-sm placeholder:text-gray-400">
      </div>

      <div x-show="mobileSearchOpen" x-transition class="mt-3 sm:hidden">
        <input type="text" x-model="searchQuery" placeholder="Cari produk..." spellcheck="false"
               class="w-full px-4 py-2.5 border border-emerald-200 rounded-full bg-white/80 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 text-sm placeholder:text-gray-400">
      </div>
    </div>

    <!-- Navigasi 2 Tab -->
    <div class="max-w-6xl mx-auto px-4 pb-2">
      <div class="grid grid-cols-2 gap-2 border-t border-emerald-100 pt-2">
        <button @click="activeTab = 'khas'" :class="activeTab === 'khas' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-100' : 'bg-white text-gray-500 hover:bg-emerald-50'" 
                class="w-full py-2.5 px-3 rounded-full text-sm font-medium text-center transition-all duration-200">Produk Khas</button>
        <button @click="activeTab = 'umum'" :class="activeTab === 'umum' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-100' : 'bg-white text-gray-500 hover:bg-emerald-50'" 
                class="w-full py-2.5 px-3 rounded-full text-sm font-medium text-center transition-all duration-200">Produk Umum</button>
      </div>
    </div>
  </header>

  <!-- Grid Produk -->
  <main class="flex-1 w-full px-3 py-6 sm:px-4 sm:py-8">
    <div class="max-w-6xl mx-auto">
      <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4 md:gap-6">
        <template x-for="product in filteredProducts" :key="product.id">
        <div @click="selectProduct(product)" class="bg-white rounded-xl sm:rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.08)] hover:-translate-y-1 hover:shadow-[0_18px_40px_rgba(16,185,129,0.12)] border border-emerald-100/80 overflow-hidden cursor-pointer flex flex-col transition-all duration-200">
          <img :src="product.image" :alt="product.name" class="h-32 w-full object-cover sm:h-52" loading="${i < 8 ? 'eager' : 'lazy'}">
          <div class="p-3 sm:p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-900 leading-snug text-sm sm:text-base" x-text="product.name"></h3>
              <p class="text-[10px] sm:text-xs text-emerald-700 font-semibold mt-1.5 sm:mt-2" x-text="product.price_range"></p>
              <p class="text-[10px] sm:text-xs text-gray-500 mt-1.5 sm:mt-2 line-clamp-2" x-text="product.description"></p>
            </div>
            <div class="mt-3 sm:mt-4 pt-2 sm:pt-3 border-t border-emerald-100 flex items-center justify-between text-[10px] sm:text-xs text-gray-400">
              <span x-text="product.sellers.length + ' Penjual Tersedia'"></span>
              <span class="text-emerald-600 font-semibold">Lihat Kontak &rarr;</span>
            </div>
          </div>
        </div>
        </template>
      </div>
    </div>
  </main>

  <a href="https://wa.me/6288888888?text=Halo%20Admin%20Tumbas%2C%20saya%20ingin%20menambahkan%20produk%20UMKM%20saya%20ke%20katalog.%20Mohon%20informasi%20cara%20pendaftarannya."
     aria-label="Hubungi admin melalui WhatsApp untuk menambahkan produk UMKM"
    :class="{ 'wa-hint-open': whatsappHintVisible }"
    class="group fixed bottom-4 right-4 z-40 flex h-14 w-fit flex-row-reverse items-center justify-start gap-0 overflow-hidden rounded-full bg-emerald-700 px-1.5 text-white shadow-lg shadow-emerald-900/20 transition-[gap,background-color,box-shadow] duration-300 hover:gap-3 hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-300 focus-visible:gap-3 sm:bottom-6 sm:right-6">
    <span class="flex h-11 w-11 shrink-0 items-center justify-center text-white">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="h-7 w-7" fill="currentColor" aria-hidden="true">
        <path d="M16.02 3C8.86 3 3.04 8.75 3.04 15.82c0 2.26.6 4.47 1.74 6.42L3 29l6.98-1.8a13.1 13.1 0 0 0 6.04 1.46h.01c7.16 0 12.98-5.75 12.98-12.82 0-3.43-1.36-6.65-3.83-9.08A13 13 0 0 0 16.02 3Zm0 23.48h-.01a10.9 10.9 0 0 1-5.53-1.5l-.4-.24-4.14 1.07 1.1-4.01-.26-.41a10.58 10.58 0 0 1-1.66-5.57c0-5.98 4.9-10.84 10.91-10.84 2.91 0 5.65 1.12 7.71 3.16a10.7 10.7 0 0 1 3.2 7.68c0 5.98-4.9 10.84-10.92 10.84Zm5.99-8.12c-.33-.16-1.94-.95-2.24-1.06-.3-.11-.52-.16-.74.16-.22.33-.85 1.06-1.04 1.28-.19.22-.38.25-.71.08-.33-.16-1.39-.51-2.64-1.62-.98-.86-1.64-1.92-1.83-2.24-.19-.33-.02-.5.14-.66.15-.14.33-.38.49-.57.16-.19.22-.33.33-.55.11-.22.06-.41-.03-.57-.08-.16-.74-1.77-1.01-2.42-.27-.63-.54-.55-.74-.56h-.63c-.22 0-.57.08-.87.41-.3.33-1.14 1.11-1.14 2.72s1.17 3.16 1.34 3.38c.16.22 2.3 3.48 5.57 4.88.78.33 1.39.53 1.86.68.78.25 1.49.21 2.05.13.63-.09 1.94-.79 2.21-1.55.27-.76.27-1.41.19-1.55-.08-.14-.3-.22-.63-.38Z" />
      </svg>
    </span>
    <span role="tooltip"
      class="wa-hint-label pointer-events-none max-w-0 shrink-0 overflow-hidden whitespace-nowrap text-left text-sm font-bold leading-snug opacity-0 transition-[max-width,opacity,padding] duration-300 group-hover:max-w-[calc(100vw-7rem)] group-hover:pl-2 group-hover:opacity-100 group-focus-visible:max-w-[calc(100vw-7rem)] group-focus-visible:pl-2 group-focus-visible:opacity-100">
      Hubungi admin via WhatsApp
    </span>
  </a>

  <!-- Modal Detail & Seller Contacts -->
  <div x-show="selectedProduct" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div @click.away="selectedProduct = null" class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-hidden shadow-[0_24px_70px_rgba(16,185,129,0.18)]">
      <div class="max-h-[90vh] overflow-y-auto hide-scrollbar">
        <img :src="selectedProduct?.image" :alt="selectedProduct?.name" class="block aspect-[16/9] w-full object-cover">
        <div class="p-6">
        <div class="flex justify-between items-start gap-4">
          <h2 class="text-xl font-bold text-gray-900" x-text="selectedProduct?.name"></h2>
          <button @click="selectedProduct = null" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <p class="text-sm text-gray-600 mt-2 leading-relaxed" x-text="selectedProduct?.description"></p>

        <div class="mt-6 border-t border-emerald-100 pt-4">
          <h4 class="text-sm font-bold text-gray-800 mb-3">Penjual produk</h4>
          <div class="space-y-3">
            <template x-if="selectedProduct?.sellers?.length">
              <template x-for="seller in selectedProduct?.sellers" :key="seller.name">
                <div class="p-4 border border-emerald-100 rounded-xl bg-emerald-50/50 flex flex-col gap-3">
                  <div class="flex min-w-0 items-start gap-3">
                    <template x-if="seller.image">
                      <img :src="seller.image" :alt="'Foto ' + seller.name"
                        class="h-14 w-14 shrink-0 rounded-lg border border-emerald-100 object-cover"
                        loading="lazy" @error="$el.classList.add('hidden')">
                    </template>
                    <div class="min-w-0">
                      <p class="font-bold text-sm text-gray-900" x-text="seller.name"></p>
                      <p x-show="seller.description" class="text-xs text-gray-600 mt-1 leading-relaxed"
                        x-text="seller.description"></p>
                      <p class="text-xs text-gray-600 mt-1 leading-relaxed" x-text="seller.address"></p>
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <a :href="'https://wa.me/' + seller.phone + '?text=' + encodeURIComponent('Halo, saya melihat produk ' + selectedProduct.name + ' di Katalog UMKM Purworejo.')" 
                       target="_blank" rel="noopener noreferrer" class="inline-flex min-h-10 items-center justify-center bg-emerald-600 text-white text-xs text-center px-3 rounded-lg font-semibold hover:bg-emerald-700 transition focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">WhatsApp</a>
                    <a :href="seller.maps_url" target="_blank" rel="noopener noreferrer"
                       class="inline-flex min-h-10 items-center justify-center border border-emerald-200 bg-white text-emerald-700 text-xs text-center px-3 rounded-lg font-semibold hover:bg-emerald-100/70 transition focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">Lihat lokasi</a>
                  </div>
                </div>
              </template>
            </template>

            <template x-if="selectedProduct && (!selectedProduct?.sellers || selectedProduct?.sellers.length === 0)">
              <p class="rounded-xl border border-dashed border-emerald-200 bg-emerald-50/50 px-4 py-5 text-center text-sm text-gray-600">Belum ada penjual untuk produk ini.</p>
            </template>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function katalogApp() {
      return {
        activeTab: 'khas',
        searchQuery: '',
        mobileSearchOpen: false,
        whatsappHintVisible: false,
        products: [],
        selectedProduct: null,
        async init() {
          this.whatsappHintVisible = true;
          window.setTimeout(() => {
            this.whatsappHintVisible = false;
          }, 2000);

          const res = await fetch('/api/products');
          this.products = await res.json();
        },
        get filteredProducts() {
          return this.products.filter(p => {
            const matchesTab = p.category_tab === this.activeTab;
            const matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesTab && matchesSearch;
          });
        },
        selectProduct(p) {
          this.selectedProduct = p;
        }
      }
    }
  </script>
</body>
</html>
