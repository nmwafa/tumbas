<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk UMKM Purworejo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-lime-50 text-gray-800" x-data="katalogApp()">

  <!-- Navbar -->
  <header class="bg-white/90 border-b border-emerald-100 sticky top-0 z-40 backdrop-blur-sm shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 min-w-0">
          <img src="/img/logo.png" alt="Logo Purworejo" class="h-10 w-auto max-w-[180px] sm:h-12 sm:max-w-[220px] md:h-14 md:max-w-[260px] object-contain">
        </div>

        <button type="button"
                @click="mobileSearchOpen = !mobileSearchOpen"
                class="sm:hidden inline-flex items-center justify-center w-11 h-11 rounded-full border border-emerald-200 bg-white text-emerald-600 shadow-sm hover:bg-emerald-50 transition-all duration-200"
                aria-label="Buka pencarian">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>

        <input type="text" x-model="searchQuery" placeholder="Cari nama produk..."
               class="hidden sm:block w-full sm:w-80 px-4 py-2.5 border border-emerald-200 rounded-full bg-white/80 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 text-sm placeholder:text-gray-400">
      </div>

      <div x-show="mobileSearchOpen" x-transition class="mt-3 sm:hidden">
        <input type="text" x-model="searchQuery" placeholder="Cari nama produk..."
               class="w-full px-4 py-2.5 border border-emerald-200 rounded-full bg-white/80 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 text-sm placeholder:text-gray-400">
      </div>
    </div>

    <!-- Navigasi 2 Tab -->
    <div class="max-w-6xl mx-auto px-4 pb-2">
      <div class="grid grid-cols-2 gap-2 border-t border-emerald-100 pt-2">
        <button @click="activeTab = 'khas'" :class="activeTab === 'khas' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-200' : 'bg-white text-gray-500 hover:bg-emerald-50'" 
                class="w-full py-2.5 px-3 rounded-full text-sm font-medium text-center transition-all duration-200">Produk Khas Purworejo</button>
        <button @click="activeTab = 'umum'" :class="activeTab === 'umum' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-200' : 'bg-white text-gray-500 hover:bg-emerald-50'" 
                class="w-full py-2.5 px-3 rounded-full text-sm font-medium text-center transition-all duration-200">UMKM Umum</button>
      </div>
    </div>
  </header>

  <!-- Grid Produk -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <template x-for="product in filteredProducts" :key="product.id">
        <div @click="selectProduct(product)" class="bg-white rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.08)] hover:-translate-y-1 hover:shadow-[0_18px_40px_rgba(16,185,129,0.12)] border border-emerald-100/80 overflow-hidden cursor-pointer flex flex-col transition-all duration-200">
          <img :src="product.image" :alt="product.name" class="h-52 w-full object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-900 leading-snug text-base" x-text="product.name"></h3>
              <p class="text-xs text-emerald-700 font-semibold mt-2" x-text="product.price_range"></p>
              <p class="text-xs text-gray-500 mt-2 line-clamp-2" x-text="product.description"></p>
            </div>
            <div class="mt-4 pt-3 border-t border-emerald-100 flex items-center justify-between text-xs text-gray-400">
              <span x-text="product.sellers.length + ' Penjual Tersedia'"></span>
              <span class="text-emerald-600 font-semibold">Lihat Kontak &rarr;</span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- Modal Detail & Seller Contacts -->
  <div x-show="selectedProduct" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
    <div @click.away="selectedProduct = null" class="bg-white rounded-3xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto shadow-[0_25px_60px_rgba(15,23,42,0.25)] border border-emerald-100">
      <div class="flex justify-between items-start gap-4">
        <h2 class="text-xl font-bold text-gray-900" x-text="selectedProduct?.name"></h2>
        <button @click="selectedProduct = null" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>
      <p class="text-sm text-gray-600 mt-2 leading-relaxed" x-text="selectedProduct?.description"></p>

      <div class="mt-6 border-t border-emerald-100 pt-4">
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Daftar Penjual / Lokasi</h4>
        <div class="space-y-3">
          <template x-for="seller in selectedProduct?.sellers" :key="seller.name">
            <div class="p-3 border border-emerald-100 rounded-2xl bg-emerald-50/60 flex flex-col gap-2">
              <div>
                <p class="font-semibold text-sm text-gray-900" x-text="seller.name"></p>
                <p class="text-xs text-gray-500 mt-1" x-text="seller.address"></p>
              </div>
              <div class="flex gap-2 mt-1">
                <a :href="'https://wa.me/' + seller.phone + '?text=' + encodeURIComponent('Halo, saya melihat produk ' + selectedProduct.name + ' di Katalog UMKM Purworejo.')" 
                   target="_blank" class="flex-1 bg-emerald-600 text-white text-xs text-center py-2.5 px-3 rounded-xl font-medium hover:bg-emerald-700 transition">WhatsApp</a>
                <a :href="seller.maps_url" target="_blank" 
                   class="bg-blue-600 text-white text-xs text-center py-2.5 px-3 rounded-xl font-medium hover:bg-blue-700 transition">Google Maps</a>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script>
    function katalogApp() {
      return {
        activeTab: 'khas',
        searchQuery: '',
        mobileSearchOpen: false,
        products: [],
        selectedProduct: null,
        async init() {
          const res = await fetch('/api/products');
          this.products = await res.json();
        },
        get filteredProducts() {
          return this.products.filter(p => {
            const matchesTab = p.category_tab === this.activeTab;
            const matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesTab && matchesSearch;
          });
        },
        selectProduct(p) {
          this.selectedProduct = p;
        }
      }
    }
  </script>
</body>
</html>
